name: Deploy RWX-Agent website

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate website and recordings
        run: |
          python3 web/tools/check_site.py
          node --check web/app.js
      - name: Prepare static site
        run: |
          mkdir -p _site/resource
          cp web/index.html web/styles.css web/app.js web/favicon.svg web/.nojekyll _site/
          cp web/resource/matches.json _site/resource/
          cp -R web/resource/matches web/resource/posters _site/resource/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
